server:
  port: 8080

spring:
  application:
    name: gateway-service
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:}
        namespace: ${NACOS_NAMESPACE:}
        group: ${NACOS_GROUP:CXT_SHOPPING}
    loadbalancer:
      cache:
        enabled: false
    gateway:
      server:
        webflux:
          routes:
            - id: auth-service
              uri: lb://user-service
              predicates:
                - Path=/api/auth/**
            - id: user-service
              uri: lb://user-service
              predicates:
                - Path=/api/users/**
            - id: product-service
              uri: lb://product-service
              predicates:
                - Path=/api/products/**
            - id: order-service
              uri: lb://order-service
              predicates:
                - Path=/api/orders/**

app:
  jwt:
    secret: ${JWT_SECRET:change-me-jwt-secret-32-characters}

management:
  endpoints:
    web:
      exposure:
        include: health
