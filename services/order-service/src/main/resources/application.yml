server:
  port: 8083

spring:
  application:
    name: order-service
  datasource:
    url: "${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/shopping_order?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=utf8}"
    username: ${SPRING_DATASOURCE_USERNAME:order_app}
    password: ${SPRING_DATASOURCE_PASSWORD:change-me}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
  sql:
    init:
      mode: never

clients:
  connect-timeout: ${HTTP_CONNECT_TIMEOUT:2s}
  read-timeout: ${HTTP_READ_TIMEOUT:3s}
  user-service-url: ${USER_SERVICE_URL:http://localhost:8081}
  product-service-url: ${PRODUCT_SERVICE_URL:http://localhost:8082}

management:
  endpoints:
    web:
      exposure:
        include: health
