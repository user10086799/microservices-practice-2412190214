server:
  port: 8083

spring:
  application:
    name: order-service
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:}
        namespace: ${NACOS_NAMESPACE:}
        group: ${NACOS_GROUP:CXT_SHOPPING}
    openfeign:
      client:
        config:
          default:
            connectTimeout: ${FEIGN_CONNECT_TIMEOUT:2000}
            readTimeout: ${FEIGN_READ_TIMEOUT:3000}
    loadbalancer:
      cache:
        enabled: false
  datasource:
    url: "${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/shopping_order?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=utf8}"
    username: ${SPRING_DATASOURCE_USERNAME:order_app}
    password: ${SPRING_DATASOURCE_PASSWORD:change-me}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
  sql:
    init:
      mode: never

instance:
  id: ${INSTANCE_ID:order-1}

management:
  endpoints:
    web:
      exposure:
        include: health
