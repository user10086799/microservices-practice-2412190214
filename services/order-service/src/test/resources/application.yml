spring:
  datasource:
    url: jdbc:h2:mem:shopping_order;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
  sql:
    init:
      mode: never

  cloud:
    nacos:
      discovery:
        enabled: false
        register-enabled: false
    service-registry:
      auto-registration:
        enabled: false

clients:
  connect-timeout: 2s
  read-timeout: 3s
