spring:
  datasource:
    url: jdbc:h2:mem:shopping_order;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
  sql:
    init:
      mode: never

clients:
  connect-timeout: 2s
  read-timeout: 3s
  user-service-url: http://user-service:8081
  product-service-url: http://product-service:8082
