server:
  port: 8082

spring:
  application:
    name: product-service
  datasource:
    url: "${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/shopping_product?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=utf8}"
    username: ${SPRING_DATASOURCE_USERNAME:product_app}
    password: ${SPRING_DATASOURCE_PASSWORD:change-me}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
  sql:
    init:
      mode: never

management:
  endpoints:
    web:
      exposure:
        include: health
