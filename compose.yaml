services:
  mysql-user:
    image: mysql:8.4.11
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: shopping_user
      MYSQL_USER: user_app
      MYSQL_PASSWORD: ${USER_DB_PASSWORD}
    volumes:
      - user-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    networks:
      - shopping

  mysql-product:
    image: mysql:8.4.11
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: shopping_product
      MYSQL_USER: product_app
      MYSQL_PASSWORD: ${PRODUCT_DB_PASSWORD}
    volumes:
      - product-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    networks:
      - shopping

  mysql-order:
    image: mysql:8.4.11
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: shopping_order
      MYSQL_USER: order_app
      MYSQL_PASSWORD: ${ORDER_DB_PASSWORD}
    volumes:
      - order-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    networks:
      - shopping

  nacos:
    image: nacos/nacos-server:v3.2.4
    pull_policy: if_not_present
    environment:
      MODE: standalone
      PREFER_HOST_MODE: hostname
      JVM_XMS: 256m
      JVM_XMX: 512m
      NACOS_AUTH_ENABLE: "true"
      NACOS_AUTH_TOKEN: ${NACOS_AUTH_TOKEN}
      NACOS_AUTH_IDENTITY_KEY: ${NACOS_AUTH_IDENTITY_KEY}
      NACOS_AUTH_IDENTITY_VALUE: ${NACOS_AUTH_IDENTITY_VALUE}
    ports:
      - "127.0.0.1:${NACOS_CONSOLE_PORT:-18080}:8080"
      - "127.0.0.1:8848:8848"
      - "127.0.0.1:9848:9848"
    volumes:
      - nacos-data:/home/nacos/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8848/nacos/v3/admin/core/state || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 40s
    networks:
      - shopping

  user-service:
    image: user-service:week08
    build:
      context: ./services/user-service
    ports:
      - "${USER_PORT:-8081}:8081"
    environment:
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql-user:3306/shopping_user?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=utf8"
      SPRING_DATASOURCE_USERNAME: user_app
      SPRING_DATASOURCE_PASSWORD: ${USER_DB_PASSWORD}
      SPRING_DATASOURCE_HIKARI_INITIALIZATION_FAIL_TIMEOUT: 60000
      NACOS_SERVER_ADDR: nacos:8848
      NACOS_USERNAME: ${NACOS_USERNAME:-nacos}
      NACOS_PASSWORD: ${NACOS_PASSWORD}
      NACOS_GROUP: CXT_SHOPPING
      INSTANCE_ID: user-1
    depends_on:
      mysql-user:
        condition: service_healthy
      nacos:
        condition: service_healthy
    networks:
      - shopping

  product-service-a:
    image: product-service:week08
    build:
      context: ./services/product-service
    ports:
      - "${PRODUCT_PORT:-8082}:8082"
    environment:
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql-product:3306/shopping_product?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=utf8"
      SPRING_DATASOURCE_USERNAME: product_app
      SPRING_DATASOURCE_PASSWORD: ${PRODUCT_DB_PASSWORD}
      SPRING_DATASOURCE_HIKARI_INITIALIZATION_FAIL_TIMEOUT: 60000
      NACOS_SERVER_ADDR: nacos:8848
      NACOS_USERNAME: ${NACOS_USERNAME:-nacos}
      NACOS_PASSWORD: ${NACOS_PASSWORD}
      NACOS_GROUP: CXT_SHOPPING
      INSTANCE_ID: product-a
    depends_on:
      mysql-product:
        condition: service_healthy
      nacos:
        condition: service_healthy
    networks:
      - shopping

  product-service-b:
    image: product-service:week08
    build:
      context: ./services/product-service
    ports:
      - "${PRODUCT_PORT_B:-18083}:8082"
    environment:
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql-product:3306/shopping_product?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=utf8"
      SPRING_DATASOURCE_USERNAME: product_app
      SPRING_DATASOURCE_PASSWORD: ${PRODUCT_DB_PASSWORD}
      SPRING_DATASOURCE_HIKARI_INITIALIZATION_FAIL_TIMEOUT: 60000
      NACOS_SERVER_ADDR: nacos:8848
      NACOS_USERNAME: ${NACOS_USERNAME:-nacos}
      NACOS_PASSWORD: ${NACOS_PASSWORD}
      NACOS_GROUP: CXT_SHOPPING
      INSTANCE_ID: product-b
    depends_on:
      mysql-product:
        condition: service_healthy
      nacos:
        condition: service_healthy
    networks:
      - shopping

  order-service:
    image: order-service:week08
    build:
      context: ./services/order-service
    ports:
      - "${ORDER_PORT:-8083}:8083"
    environment:
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql-order:3306/shopping_order?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=utf8"
      SPRING_DATASOURCE_USERNAME: order_app
      SPRING_DATASOURCE_PASSWORD: ${ORDER_DB_PASSWORD}
      SPRING_DATASOURCE_HIKARI_INITIALIZATION_FAIL_TIMEOUT: 60000
      NACOS_SERVER_ADDR: nacos:8848
      NACOS_USERNAME: ${NACOS_USERNAME:-nacos}
      NACOS_PASSWORD: ${NACOS_PASSWORD}
      NACOS_GROUP: CXT_SHOPPING
      INSTANCE_ID: order-1
      FEIGN_CONNECT_TIMEOUT: 2000
      FEIGN_READ_TIMEOUT: 3000
    depends_on:
      mysql-order:
        condition: service_healthy
      nacos:
        condition: service_healthy
      user-service:
        condition: service_started
      product-service-a:
        condition: service_started
      product-service-b:
        condition: service_started
    networks:
      - shopping

volumes:
  user-mysql-data:
  product-mysql-data:
  order-mysql-data:
  nacos-data:

networks:
  shopping:
